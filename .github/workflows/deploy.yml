
name: Deploy FoodRank

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar configuração pública do Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure as variáveis públicas do Supabase nos secrets de Actions."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Verificar codigo
        run: npm run lint

      - name: Testes obrigatorios
        run: npm test

      - name: Validar Edge Function
        run: npx --yes deno@2.9.6 check supabase/functions/get-restaurants/index.ts

      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium

      - name: Testes de navegacao
        run: npm run test:e2e

      - name: Verificar contrato do backend antes de publicar
        run: npm run verify:backend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FOODRANK_APP_ORIGIN: https://isaaaakkj.github.io
          FOODRANK_SMOKE_CITIES_JSON: ${{ vars.FOODRANK_SMOKE_CITIES_JSON }}

      - name: Gerar versão de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Validar artefato
        run: node scripts/verify-dist.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
